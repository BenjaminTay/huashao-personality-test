name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set analytics env
        run: echo "NEXT_PUBLIC_GOATCOUNTER_SITE=${{ vars.NEXT_PUBLIC_GOATCOUNTER_SITE }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@3.90.0 pages project create huaxue-test --production-branch=main || echo "项目已存在，跳过创建"
          npx --yes wrangler@3.90.0 pages deploy out --project-name=huaxue-test --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

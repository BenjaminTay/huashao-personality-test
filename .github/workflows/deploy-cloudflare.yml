name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # 每日数据刷新：构建前现场生成最新"测友坐标"快照后部署，不产生任何提交。
    # 与代码 push 部署共用同一流水线，但 schedule 运行会跳过 lint/typecheck/test。
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate population snapshot
        run: node scripts/sync-population.mjs
        env:
          GOATCOUNTER_SITE: ${{ secrets.GOATCOUNTER_SITE }}
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
          GOATCOUNTER_SINCE: ${{ vars.GOATCOUNTER_SINCE }}
        # 数据刷新失败不应阻断代码上线：告警后沿用仓库内的静态基线继续构建。
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set analytics env
        run: echo "NEXT_PUBLIC_GOATCOUNTER_SITE=${{ vars.NEXT_PUBLIC_GOATCOUNTER_SITE }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: github.event_name != 'schedule'
        run: npm run lint

      - name: Typecheck
        if: github.event_name != 'schedule'
        run: npm run typecheck

      - name: Test
        if: github.event_name != 'schedule'
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@3.90.0 pages project create huaxue-test --production-branch=main || echo "项目已存在，跳过创建"
          npx --yes wrangler@3.90.0 pages deploy out --project-name=huaxue-test --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

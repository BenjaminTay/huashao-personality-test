name: Sync population stats snapshot

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync snapshot
        run: node scripts/sync-population.mjs
        env:
          GOATCOUNTER_SITE: ${{ secrets.GOATCOUNTER_SITE }}
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
          GOATCOUNTER_SINCE: ${{ vars.GOATCOUNTER_SINCE }}

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- data/population-stats.ts; then
            echo "快照无变化，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/population-stats.ts
            git commit -m "chore: 更新测友分布快照"
            git push
          fi
